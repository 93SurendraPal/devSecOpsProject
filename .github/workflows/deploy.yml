name: CI-CD-Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Image
      run: |
        docker build -t surendragalaxy/dev-secops-project:latest .

    - name: Push Image
      run: |
        docker push surendragalaxy/dev-secops-project:latest

    - name: Deploy EC2-1
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST_1 }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull surendragalaxy/dev-secops-project:latest
          docker stop flask-app || true
          docker rm flask-app || true
          docker run -d \
          --name flask-app \
          -p 5000:5000 \
          --restart always \
          surendragalaxy/dev-secops-project:latest

    - name: Deploy EC2-2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST_2 }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull surendragalaxy/dev-secops-project:latest
          docker stop flask-app || true
          docker rm flask-app || true
          docker run -d \
          --name flask-app \
          -p 5000:5000 \
          --restart always \
          surendragalaxy/dev-secops-project:latest